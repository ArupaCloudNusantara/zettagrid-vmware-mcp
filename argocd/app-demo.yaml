apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zettagrid-mcp-demo
  namespace: argocd
spec:
  project: zettagrid-mcp
  source:
    repoURL: https://github.com/ArupaCloudNusantara/zettagrid-vmware-mcp.git
    targetRevision: main
    path: k8s/apps/demo
  destination:
    server: https://kubernetes.default.svc
    namespace: zettagrid-mcp
  # No automated block: this channel only moves when promote-demo.yml
  # explicitly runs `argocd app sync`. Never point this at `latest`.
  syncPolicy:
    syncOptions:
      # CreateNamespace is safe here even though `internal` usually creates the
      # namespace first — idempotent, and this app shouldn't depend on sync order
      # against the other one.
      - CreateNamespace=true
