apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zettagrid-mcp-internal
  namespace: argocd
spec:
  project: zettagrid-mcp
  source:
    repoURL: https://github.com/ArupaCloudNusantara/zettagrid-vmware-mcp.git
    targetRevision: main
    path: k8s/apps/internal
  destination:
    server: https://kubernetes.default.svc
    namespace: zettagrid-mcp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Neither app's source path includes k8s/namespace.yaml (they only sync
      # k8s/apps/{internal,demo}), so without this the first sync fails with
      # "namespace not found" — found while double-checking readiness for a real
      # Argo CD install, not caught in the original integration pass.
      - CreateNamespace=true
