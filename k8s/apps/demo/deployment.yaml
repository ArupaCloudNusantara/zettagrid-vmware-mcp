apiVersion: apps/v1
kind: Deployment
metadata:
  name: zettagrid-mcp-demo
  namespace: zettagrid-mcp
  labels:
    app: zettagrid-mcp
    channel: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zettagrid-mcp
      channel: demo
  template:
    metadata:
      labels:
        app: zettagrid-mcp
        channel: demo
    spec:
      containers:
        - name: zettagrid-mcp
          image: ghcr.io/arupacloudnusantara/zettagrid-vmware-mcp:placeholder # only ever set by promote-demo.yml
          ports:
            - containerPort: 3001
          env:
            - name: TRANSPORT
              value: "http"
            - name: PORT
              value: "3001"
          envFrom:
            # Dedicated demo tenant, scoped + rate-limited, reset nightly:
            # ZETTAGRID_ORGANIZATION, ZETTAGRID_DEFAULT_ZONE, ZETTAGRID_API_VERSION,
            # ZETTAGRID_API_TOKEN_<ZONE> for the zone(s) actually used in demos.
            # Applied out-of-band via kubectl, never committed to git.
            - secretRef:
                name: zettagrid-mcp-demo-creds
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
