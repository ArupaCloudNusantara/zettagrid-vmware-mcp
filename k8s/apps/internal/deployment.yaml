apiVersion: apps/v1
kind: Deployment
metadata:
  name: zettagrid-mcp-internal
  namespace: zettagrid-mcp
  labels:
    app: zettagrid-mcp
    channel: internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zettagrid-mcp
      channel: internal
  template:
    metadata:
      labels:
        app: zettagrid-mcp
        channel: internal
    spec:
      containers:
        - name: zettagrid-mcp
          image: ghcr.io/arupacloudnusantara/zettagrid-vmware-mcp:placeholder # managed by kustomize `images:` below
          ports:
            - containerPort: 3001
          env:
            - name: TRANSPORT
              value: "http"
            - name: PORT
              value: "3001"
          envFrom:
            # Sandbox Zettagrid tenant: ZETTAGRID_ORGANIZATION, ZETTAGRID_DEFAULT_ZONE,
            # ZETTAGRID_API_VERSION, ZETTAGRID_API_TOKEN_<ZONE> for whichever zone(s)
            # this channel uses. Applied out-of-band via kubectl, never in git.
            - secretRef:
                name: zettagrid-mcp-sandbox-creds
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
