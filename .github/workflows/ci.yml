name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  security-events: write

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # test:coverage is NOT run here on purpose: it runs the tests/ suite, which is a live
      # integration suite against real VCD infrastructure (300s timeout per test, requires
      # tests/config.js with real Zettagrid credentials) — not a mocked unit suite. Running it
      # on every PR would mean every PR mutates real infrastructure and takes a very long time,
      # with no CI credentials currently provisioned for it anyway. See docs/CICD.md for the
      # open decision on whether/how to wire this in as a separate, deliberately-triggered job.
      - run: npm audit --audit-level=high

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  build-and-push:
    needs: [lint-test, codeql]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "sha_tag=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      # ghcr.io requires an all-lowercase image path. github.repository preserves the repo's
      # actual casing (ArupaCloudNusantara/...) and does NOT lowercase itself automatically —
      # using it directly here would produce an invalid, rejected image reference. Matches the
      # already-lowercase image name hardcoded in k8s/apps/*/kustomization.yaml.
      - name: Build image name
        run: echo "IMAGE=ghcr.io/arupacloudnusantara/zettagrid-vmware-mcp" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Internal channel only. This auto-updates on every merge to main —
      # the demo channel is NEVER touched by this workflow (see promote-demo.yml).
      - name: Bump internal channel image tag
        run: |
          cd k8s/apps/internal
          sed -i "s|newTag:.*|newTag: ${{ steps.meta.outputs.sha_tag }}|" kustomization.yaml
          git config user.name "ci-bot"
          git config user.email "ci-bot@arupa.id"
          git commit -am "chore(internal): bump image to ${{ steps.meta.outputs.sha_tag }} [skip ci]"
          git push
